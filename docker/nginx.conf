# Static server for the emulator's web build. TLS, auth and the public
# hostname belong to the reverse proxy in front of this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/wasm application/json text/css;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # File names are not content-hashed: revalidate every load (ETag keeps it cheap).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
