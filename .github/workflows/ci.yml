name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: native build + smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # WiliBSP's nested libs/onewili (the MAIN-CPU link)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev zlib1g-dev python3
      - name: Build and run every app headless
        run: tests/smoke.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-native
          path: |
            out/*.png
            out/*.log
          if-no-files-found: ignore

  sanitize:
    name: sanitizers (ASan + UBSan) + smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # WiliBSP's nested libs/onewili (the MAIN-CPU link)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev zlib1g-dev python3
      # ASan's shadow layout does not fit the 32-bit mmap randomisation that
      # newer runner kernels use; 28 bits is the usual setting.
      - name: Limit mmap randomisation for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build with FW2_EMU_SANITIZE and run every app headless
        run: tests/smoke.sh
        env:
          BUILD_DIR: build-asan
          CMAKE_ARGS: -DFW2_EMU_SANITIZE=ON
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-sanitize
          path: |
            out/*.png
            out/*.log
          if-no-files-found: ignore

  m32:
    name: 32-bit build + smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # WiliBSP's nested libs/onewili (the MAIN-CPU link)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-multilib python3
      - name: Build with FW2_EMU_32BIT and run every app headless
        run: tests/smoke.sh
        env:
          BUILD_DIR: build-m32
          CMAKE_ARGS: -DFW2_EMU_32BIT=ON
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-m32
          path: out/*.log
          if-no-files-found: ignore

  hwcheck:
    name: real-hardware check (Pico SDK + Arm GNU Toolchain 14.2.Rel1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # WiliBSP's libs/onewili is needed for hardware builds
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3
      # Arm GNU Toolchain 14.2.Rel1 (what WiliBSP builds with), Pico SDK 2.3.0
      # and picotool all live in ~/.cache/fw2emu.
      - name: Cache toolchain, Pico SDK and picotool
        uses: actions/cache@v6
        with:
          path: ~/.cache/fw2emu
          key: fw2emu-arm-14.2.rel1-pico-sdk-2.3.0-${{ runner.os }}-${{ hashFiles('tools/fw2emu') }}
          restore-keys: fw2emu-arm-14.2.rel1-pico-sdk-2.3.0-${{ runner.os }}-
      - name: Build every app for the RP2350 and check memory and stack
        # Known upstream failures of WiliBSP's own examples (hello_psram_exec's
        # layout check, the OneWili stack use of toggleled / hello_vref) are
        # listed in tools/fw2emu (KNOWN_UPSTREAM) and reported as
        # "KNOWN (upstream)" without failing the run; any other error fails
        # it. If a listed issue stops occurring, hwcheck emits a warning
        # annotation so the list gets updated.
        run: |
          mkdir -p out
          tools/fw2emu hwcheck --fetch-toolchain -v -o out/hwcheck.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hwcheck
          path: out/hwcheck*.json
          if-no-files-found: ignore

  action:
    name: GitHub Action (action.yml)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run the action from this checkout on a self-test app
        id: selftest
        uses: ./
        with:
          app: tests/apps/script_check
          script: tests/scripts/script_check.txt
          artifact-name: action-selftest
      - name: Check its output
        run: test "${{ steps.selftest.outputs.result }}" = pass
      # What `uses: dfdarty/freewili2-emu@REF` does in someone else's repo:
      # GitHub hands over the action without submodules, so it fetches them.
      - name: Fetch the emulator the way a remote use does
        if: github.event_name == 'push'
        env:
          ACTION_PATH: ${{ runner.temp }}/_actions/${{ github.repository }}/${{ github.sha }}
          ACTION_REPO: ""
          ACTION_REF: ""
        run: |
          mkdir -p "$ACTION_PATH"
          bash tools/action-setup.sh
          test -f "$RUNNER_TEMP/freewili2-emu/third_party/wilibsp/libs/onewili/CMakeLists.txt"

  web:
    name: web build (Emscripten 4.0.15)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # WiliBSP's nested libs/onewili (the MAIN-CPU link)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web
          ls -l build-web/bin
