# Documentation site + the in-browser emulator, published to GitHub Pages.
#   https://dfdarty.github.io/freewili2-emu/           docs (MkDocs Material, from docs/)
#   https://dfdarty.github.io/freewili2-emu/emulator/  the WebAssembly build of every example app
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only publish while the repository is public (a private repo on the free
    # plan can't serve Pages); this resumes by itself once it's public again.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # WiliBSP's nested libs/onewili (the MAIN-CPU link)
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache-pages
      - name: Build the emulator for the browser
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DFW2_EMU_WEB_DEMO=ON
          cmake --build build-web
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build the docs
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict -d site
      - name: Assemble the site
        run: |
          mkdir -p site/emulator
          cp build-web/bin/index.html build-web/bin/apps.json \
             build-web/bin/*.js build-web/bin/*.wasm site/emulator/
          ls -l site site/emulator
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
